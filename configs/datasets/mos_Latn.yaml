language: mos_Latn

# MT and TTS use the FLORES+ dev and devtest splits of goaicorp/MooreMTBench
# (gated, manual approval: HF_TOKEN must belong to an account with access).
# The four domain groups are disabled until their data is fixed.

tasks:
  mt:
    sources:
      - id: moore_mt_bench_flores
        hf_dataset: goaicorp/MooreMTBench
        hf_config: flores
        hf_revision: v1.0
        source_column: fra
        target_column: mos
        source_lang: fra_Latn
        target_lang: mos_Latn
        language_columns:
          eng_Latn: eng
          fra_Latn: fra
          mos_Latn: mos
        benchmark_groups:
          general:
            splits: [dev, devtest]
            description: "FLORES+ general knowledge (dev + devtest)"
          health:
            disabled: true
            splits: [health]
            description: "Health domain sentences"
          education:
            disabled: true
            splits: [education]
            description: "Education domain sentences"
          child_protection:
            disabled: true
            splits: [child_protection]
            description: "Child protection domain sentences"
          environment:
            disabled: true
            splits: [environment]
            description: "Environment domain sentences"

  asr:
    sources:
      - id: goai_moore_speech
        hf_dataset: goaicorp/GOAI-MooreSpeechCorpora
        audio_column: audio
        text_column: text
        language: mos_Latn
        benchmark_groups:
          general:
            splits: [test]
            description: "Moore speech test set (1012 samples)"

  tts:
    sources:
      - id: moore_mt_bench_flores_tts
        hf_dataset: goaicorp/MooreMTBench
        hf_config: flores
        hf_revision: v1.0
        text_column: mos
        language: mos_Latn
        benchmark_groups:
          general:
            splits: [dev, devtest]
            description: "FLORES+ general knowledge (dev + devtest)"
          health:
            disabled: true
            splits: [health]
            description: "Health domain sentences"
          education:
            disabled: true
            splits: [education]
            description: "Education domain sentences"
          child_protection:
            disabled: true
            splits: [child_protection]
            description: "Child protection domain sentences"
          environment:
            disabled: true
            splits: [environment]
            description: "Environment domain sentences"
